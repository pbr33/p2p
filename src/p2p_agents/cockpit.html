<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go-Live Cockpit</title>
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --border: #dfe3e8;
  --text: #17202a; --muted: #5d6b7a; --accent: #3056d3; --accent-soft: #e6ecfc;
  --pass: #1f8a4c; --pass-soft: #e3f4ea; --fail: #c62f3b; --fail-soft: #fbe6e8;
  --wait: #b26a00; --wait-soft: #fdf0dc; --idle: #7b8794; --idle-soft: #edf0f3;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1419; --surface: #171e26; --surface-2: #1e2731; --border: #2b3642;
    --text: #e6ebf0; --muted: #94a3b3; --accent: #7c9cff; --accent-soft: #1f2a4a;
    --pass: #4cc38a; --pass-soft: #14301f; --fail: #ff6b78; --fail-soft: #3a1a1f;
    --wait: #f2b04f; --wait-soft: #3a2a12; --idle: #8a97a5; --idle-soft: #232c36;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
header .sub { color: var(--muted); font-size: 13px; }
header .spacer { flex: 1; }
.btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--fail); }
.btn:disabled { opacity: .55; cursor: progress; }
.btn.small { padding: 3px 9px; font-size: 12.5px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; padding: 16px 20px; max-width: 1500px; margin: 0 auto; }
@media (max-width: 1000px) { .layout { grid-template-columns: 1fr; padding: 12px 16px; } .chat { position: static !important; height: 560px !important; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.run { padding: 18px; margin-bottom: 16px; }
.run-head { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.run-title { flex: 1; min-width: 220px; }
.run-title h2 { font-size: 16px; margin: 0 0 4px; word-break: break-word; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
.chip.ent { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
.ring { position: relative; width: 84px; height: 84px; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-weight: 700; font-size: 20px; line-height: 1.05; }
.ring .num small { display: block; font-size: 10px; font-weight: 500; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.bars { display: grid; gap: 6px; min-width: 190px; }
.bar { display: grid; grid-template-columns: 62px 1fr 36px; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.bar .track { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .5s; }
.pipeline { display: flex; align-items: stretch; gap: 0; margin: 16px 0 4px; overflow-x: auto; padding-bottom: 4px; }
.stage { min-width: 170px; flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--surface); position: relative; }
.stage .name { font-weight: 650; display: flex; align-items: center; gap: 6px; }
.stage .st { font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: .03em; }
.stage .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
.stage .note { font-size: 12px; margin-top: 6px; }
.stage .actions { margin-top: 8px; }
.arrow { display: grid; place-items: center; padding: 0 6px; color: var(--muted); font-size: 18px; flex: none; }
.s-passed { background: var(--pass-soft); color: var(--pass); }
.s-failed, .s-blocked { background: var(--fail-soft); color: var(--fail); }
.s-pending { background: var(--wait-soft); color: var(--wait); }
.s-planned, .s-notrun { background: var(--idle-soft); color: var(--idle); }
.stage.b-passed { border-color: color-mix(in srgb, var(--pass) 45%, var(--border)); }
.stage.b-failed, .stage.b-blocked { border-color: color-mix(in srgb, var(--fail) 45%, var(--border)); }
.stage.b-pending { border-color: color-mix(in srgb, var(--wait) 45%, var(--border)); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
@media (max-width: 700px) { .cols { grid-template-columns: 1fr; } }
.box h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 6px; }
.box ul { margin: 0; padding-left: 18px; }
.box li { margin: 3px 0; }
.blockers li { color: var(--fail); }
.blockers li span { color: var(--text); }
.ok { color: var(--pass); }
details { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
summary { cursor: pointer; color: var(--accent); font-weight: 600; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; }
.tablewrap { max-height: 360px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; margin-top: 8px; }
.uat-row { display: grid; grid-template-columns: 60px 1fr 90px; gap: 8px; align-items: center; font-size: 12.5px; margin: 5px 0; }
.stack { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--surface-2); }
.stack .p { background: var(--pass); } .stack .f { background: var(--fail); }
.manual label { display: flex; gap: 8px; align-items: flex-start; margin: 5px 0; cursor: pointer; }
.manual .done { color: var(--muted); font-size: 12px; }
.empty { padding: 40px 24px; text-align: center; color: var(--muted); }
.empty code { background: var(--surface-2); padding: 2px 6px; border-radius: 5px; }
.chat { position: sticky; top: 72px; height: calc(100vh - 90px); display: flex; flex-direction: column; overflow: hidden; }
.chat-head { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.chat-head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pass); }
.chat-head b { flex: 1; }
.msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 92%; padding: 9px 12px; border-radius: 12px; word-wrap: break-word; }
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
.msg.bot { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
.msg.err { align-self: stretch; background: var(--wait-soft); color: var(--text); border: 1px solid color-mix(in srgb, var(--wait) 40%, transparent); }
.msg.bot p { margin: 0 0 6px; } .msg.bot p:last-child { margin: 0; }
.msg.bot ul, .msg.bot ol { margin: 4px 0; padding-left: 18px; }
.msg.bot table { margin: 6px 0; background: var(--surface); }
.msg.bot code { background: var(--surface); padding: 1px 4px; border-radius: 4px; font-size: 12.5px; }
.msg.bot h4 { margin: 6px 0 4px; font-size: 13.5px; }
.approval { align-self: stretch; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; }
.approval b { display: block; margin-bottom: 4px; color: var(--accent); }
.approval .row { display: flex; gap: 8px; margin-top: 8px; }
.typing { color: var(--muted); font-style: italic; align-self: flex-start; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
.suggest button { font: inherit; font-size: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--accent); border-radius: 99px; padding: 4px 10px; cursor: pointer; text-align: left; }
.composer { border-top: 1px solid var(--border); padding: 10px; display: flex; gap: 8px; }
.composer textarea { flex: 1; resize: none; height: 44px; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font: inherit; background: var(--surface); color: var(--text); }
.composer textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; }
.updated { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Go-Live Cockpit</h1>
    <div class="sub">Company-code roll-outs · DEV → QA → UAT → go-live</div>
  </div>
  <div class="spacer"></div>
  <span class="updated" id="updated"></span>
  <button class="btn" id="refresh">Refresh</button>
</header>

<div class="layout">
  <main id="runs"><div class="card empty">Loading…</div></main>

  <aside class="card chat" aria-label="P2P Copilot">
    <div class="chat-head"><span class="dot"></span><b>P2P Copilot</b><button class="btn small" id="newchat">New chat</button></div>
    <div class="msgs" id="msgs">
      <div class="msg bot"><p>Hi! Ask me anything about the roll-out — in English or Hindi. I can explain what failed, compare environments, set up a new company code from a template and roll it out (you approve every system change).</p></div>
    </div>
    <div class="suggest" id="suggest">
      <button>How ready are we for go-live?</button>
      <button>Why is QA blocked and who has to fix it?</button>
      <button>Set up IN30 like IN10 for legal entity Acme Pune, in DEV and QA</button>
      <button>What is different between coupa-dev and coupa-qa?</button>
      <button>QA kyun fail hua? Hindi mein samjhao</button>
    </div>
    <form class="composer" id="composer">
      <textarea id="input" placeholder="Ask the Copilot… (Enter to send)" aria-label="Message"></textarea>
      <button class="btn primary" id="send" type="submit">Send</button>
    </form>
  </aside>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LABEL = {passed: "Passed", failed: "Failed", blocked: "Blocked", pending: "Pending", planned: "Planned"};
const openDetails = new Set();

async function api(path, body) {
  const opt = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)};
  const res = await fetch(path, opt);
  const data = await res.json().catch(() => ({error: "bad response"}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function toast(text) {
  const t = $("#toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 2600);
}

function ring(score) {
  const r = 36, c = 2 * Math.PI * r, color = score >= 80 ? "var(--pass)" : score >= 50 ? "var(--wait)" : "var(--fail)";
  return `<div class="ring" title="Go-live readiness"><svg width="84" height="84" viewBox="0 0 84 84">
    <circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="8"/>
    <circle cx="42" cy="42" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - score / 100)}" style="transition:stroke-dashoffset .6s"/></svg>
    <div class="num"><div>${score}%<small>ready</small></div></div></div>`;
}

const bar = (label, v) => `<div class="bar"><span>${label}</span><div class="track"><div class="fill" style="width:${v}%"></div></div><span>${v}%</span></div>`;

function stageCard(run, s) {
  const t = s.tests;
  const changes = s.applied ? `${s.creates} created · ${s.updates} updated` : `${s.creates} to create · ${s.updates} to update`;
  return `<div class="stage b-${s.status}">
    <div class="name">${esc(s.instance)} <span class="st s-${s.status}">${LABEL[s.status] || s.status}</span></div>
    <div class="meta">${t.pass} pass · ${t.fail} fail · ${t.pending} pending</div>
    <div class="meta">${changes}</div>
    ${s.note ? `<div class="note">${esc(s.note)}</div>` : ""}
    <div class="actions"><button class="btn small" data-verify="${esc(run)}|${esc(s.instance)}" title="Read the environment again and re-run the tests, without changing it">Re-test</button></div>
  </div>`;
}

function runCard(r) {
  if (r.error) return `<section class="card run"><h2>${esc(r.name)}</h2><p class="blockers">${esc(r.error)}</p></section>`;
  const rd = r.readiness, u = r.uat;
  const pipeline = r.stages.map(s => stageCard(r.name, s)).join('<div class="arrow">→</div>');
  const blockers = rd.blockers.length
    ? `<ul class="blockers">${rd.blockers.slice(0, 8).map(b => `<li><span>${esc(b)}</span></li>`).join("")}</ul>${rd.blockers.length > 8 ? `<div class="updated">+ ${rd.blockers.length - 8} more</div>` : ""}`
    : `<div class="ok">Nothing is blocking go-live.</div>`;
  const uatRows = Object.entries(u.by_entity).map(([e, v]) => {
    const p = v.total ? 100 * v.pass / v.total : 0, f = v.total ? 100 * v.fail / v.total : 0;
    return `<div class="uat-row"><b>${esc(e)}</b><div class="stack"><div class="p" style="width:${p}%"></div><div class="f" style="width:${f}%"></div></div><span>${v.pass + v.fail}/${v.total} run</span></div>`;
  }).join("") || `<div class="updated">No UAT scripts yet.</div>`;
  const manual = r.manual.length ? r.manual.map(m => `<label><input type="checkbox" data-manual="${esc(r.name)}|${esc(m.id)}" ${m.done ? "checked" : ""}>
      <span><b>${esc(m.id)}</b> ${esc(m.entity)} — ${esc(m.step)}${m.done ? `<div class="done">${esc(m.done)}</div>` : ""}</span></label>`).join("")
    : `<div class="updated">No manual steps.</div>`;
  return `<section class="card run" data-run="${esc(r.name)}">
    <div class="run-head">
      ${ring(rd.score)}
      <div class="run-title"><h2>${esc(r.name)}</h2>
        <div class="chips"><span class="chip">${esc(r.template)}</span><span class="chip">${esc(r.platform)}</span>${r.entities.map(e => `<span class="chip ent">${esc(e)}</span>`).join("")}</div></div>
      <div class="bars">${bar("Config", rd.config)}${bar("UAT", rd.uat)}${bar("Manual", rd.manual)}</div>
    </div>
    <div class="pipeline">${pipeline || '<div class="updated">No environment run yet.</div>'}</div>
    <div class="cols">
      <div class="box"><h3>Blocking go-live</h3>${blockers}</div>
      <div class="box"><h3>Next steps</h3><ul>${rd.next.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>
      <div class="box"><h3>UAT progress · ${u.executed}/${u.total} executed · ${u.pass} pass · ${u.fail} fail</h3>${uatRows}
        <div class="updated" style="margin-top:6px">Testers fill in “Result (Pass/Fail)” in uat-scripts.csv — results appear here.</div></div>
      <div class="box manual"><h3>Manual steps</h3>${manual}</div>
    </div>
    <details data-details="${esc(r.name)}" ${openDetails.has(r.name) ? "open" : ""}><summary>Configuration checklist and test details</summary><div class="detail-body">Loading…</div></details>
  </section>`;
}

async function loadDetail(name, el) {
  try {
    const d = await api(`/api/runs/${encodeURIComponent(name)}`);
    const envs = d.stages.map(s => s.instance);
    const rows = d.checklist.map(c => `<tr><td>${esc(c["#"])}</td><td>${esc(c.Entity)}</td><td>${esc(c.Configuration)}</td><td>${esc(c.Key)}</td>${envs.map(e => `<td>${esc(c[e] ?? "")}</td>`).join("")}</tr>`).join("");
    const problems = d.stages.flatMap(s => s.problems.map(p => `<tr><td>${esc(s.instance)}</td><td>${esc(p.id)}</td><td>${esc(p.entities)}</td><td>${esc(p.description)}</td><td class="${p.status === "fail" ? "blockers" : ""}">${esc(p.status.toUpperCase())} — ${esc(p.detail)}</td></tr>`)).join("");
    el.innerHTML = (problems ? `<h3 style="margin-top:10px">Failed / pending tests</h3><div class="tablewrap"><table><tr><th>Env</th><th>Test</th><th>Entity</th><th>Check</th><th>Result</th></tr>${problems}</table></div>` : "")
      + `<h3 style="margin-top:10px">Checklist (${d.checklist.length} items)</h3><div class="tablewrap"><table><tr><th>#</th><th>Entity</th><th>Configuration</th><th>Key</th>${envs.map(e => `<th>${esc(e)}</th>`).join("")}</tr>${rows}</table></div>`;
  } catch (e) { el.textContent = e.message; }
}

async function refresh() {
  try {
    const runs = await api("/api/runs");
    $("#runs").innerHTML = runs.length ? runs.map(runCard).join("")
      : `<div class="card empty"><h2>No roll-outs yet</h2><p>Run one from the terminal, e.g.<br><code>p2p rollout run --template coupa-company-code --answers company-codes.csv --stages coupa-dev coupa-qa --apply</code><br><br>…or ask the Copilot: “Set up IN10 for Acme India in DEV and QA”.</p></div>`;
    document.querySelectorAll("details[data-details]").forEach(d => { if (d.open) loadDetail(d.dataset.details, $(".detail-body", d)); });
    $("#updated").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) { $("#runs").innerHTML = `<div class="card empty">Cannot load roll-outs: ${esc(e.message)}</div>`; }
}

document.addEventListener("toggle", e => {
  const d = e.target;
  if (!d.matches || !d.matches("details[data-details]")) return;
  if (d.open) { openDetails.add(d.dataset.details); loadDetail(d.dataset.details, $(".detail-body", d)); }
  else openDetails.delete(d.dataset.details);
}, true);

document.addEventListener("click", async e => {
  const v = e.target.closest("[data-verify]");
  if (v) {
    const [run, instance] = v.dataset.verify.split("|");
    v.disabled = true; v.textContent = "Testing…";
    try { const s = await api(`/api/runs/${encodeURIComponent(run)}/verify`, {instance}); toast(`${instance}: ${LABEL[s.status] || s.status} — ${s.tests.pass} pass, ${s.tests.fail} fail`); }
    catch (err) { toast(err.message); }
    refresh();
  }
});

document.addEventListener("change", async e => {
  const m = e.target.closest("[data-manual]");
  if (!m) return;
  const [run, step] = m.dataset.manual.split("|");
  let by = "";
  try { by = localStorage.getItem("cockpit.name") || ""; } catch {}
  if (m.checked && !by) { by = (prompt("Your name (recorded with the step):") || "").trim(); try { localStorage.setItem("cockpit.name", by); } catch {} }
  try { await api(`/api/runs/${encodeURIComponent(run)}/manual`, {step, done: m.checked, by}); toast(`${step} ${m.checked ? "done" : "reopened"}`); }
  catch (err) { toast(err.message); }
  refresh();
});

// ───── chat ─────
function md(text) {
  const lines = esc(text).split("\n"), out = [];
  let list = null, table = [];
  const inline = s => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*]+)\*/g, "$1<i>$2</i>");
  const flushList = () => { if (list) { out.push(`<${list.tag}>${list.items.map(i => `<li>${inline(i)}</li>`).join("")}</${list.tag}>`); list = null; } };
  const flushTable = () => {
    if (!table.length) return;
    const rows = table.filter(r => !/^\|?\s*:?-{2,}/.test(r)).map(r => r.replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim())));
    out.push(`<div class="tablewrap" style="max-height:none"><table>${rows.map((r, i) => `<tr>${r.map(c => i ? `<td>${c}</td>` : `<th>${c}</th>`).join("")}</tr>`).join("")}</table></div>`);
    table = [];
  };
  for (const line of lines) {
    const t = line.trim();
    if (t.startsWith("|")) { flushList(); table.push(t); continue; }
    flushTable();
    let m;
    if ((m = t.match(/^[-*•]\s+(.*)/))) { if (!list || list.tag !== "ul") { flushList(); list = {tag: "ul", items: []}; } list.items.push(m[1]); continue; }
    if ((m = t.match(/^\d+[.)]\s+(.*)/))) { if (!list || list.tag !== "ol") { flushList(); list = {tag: "ol", items: []}; } list.items.push(m[1]); continue; }
    flushList();
    if ((m = t.match(/^#{1,4}\s+(.*)/))) { out.push(`<h4>${inline(m[1])}</h4>`); continue; }
    if (t) out.push(`<p>${inline(t)}</p>`);
  }
  flushList(); flushTable();
  return out.join("");
}

function addMsg(cls, html) {
  const div = document.createElement("div");
  div.className = "msg " + cls; div.innerHTML = html;
  $("#msgs").appendChild(div); $("#msgs").scrollTop = $("#msgs").scrollHeight;
  return div;
}

const shown = new Set();
function showApprovals(list) {
  for (const a of list || []) {
    if (shown.has(a.id)) continue;
    shown.add(a.id);
    const div = document.createElement("div");
    div.className = "approval";
    div.innerHTML = `<b>Approval needed</b>${esc(a.summary)}<div class="row"><button class="btn primary small" data-approve="${a.id}">Approve &amp; run</button><button class="btn small danger" data-reject="${a.id}">Reject</button></div>`;
    $("#msgs").appendChild(div); $("#msgs").scrollTop = $("#msgs").scrollHeight;
  }
}

$("#msgs").addEventListener("click", async e => {
  const b = e.target.closest("[data-approve],[data-reject]");
  if (!b) return;
  const id = b.dataset.approve || b.dataset.reject, approve = !!b.dataset.approve;
  const box = b.closest(".approval");
  box.querySelectorAll("button").forEach(x => x.disabled = true);
  b.textContent = approve ? "Running…" : "Rejecting…";
  try {
    const r = await api(`/api/approvals/${id}`, {approve});
    if (r.status === "rejected") { box.innerHTML = `<b>Rejected</b>${esc(r.summary)} — nothing was changed.`; }
    else {
      const st = (r.result.stages || []).map(s => `${s.environment}: <b>${LABEL[s.status] || s.status}</b> (${s.tests.pass} pass, ${s.tests.fail} fail)`).join(" → ");
      box.innerHTML = `<b>Done</b>${esc(r.summary)}<div style="margin-top:6px">${st}</div>${r.result.stopped ? `<div class="blockers" style="margin-top:4px">${esc(r.result.stopped)}</div>` : ""}`;
      refresh();
    }
  } catch (err) { box.innerHTML = `<b>Could not run</b>${esc(err.message)}`; }
});

async function send(text) {
  text = text.trim();
  if (!text) return;
  addMsg("user", esc(text));
  $("#input").value = ""; $("#send").disabled = true; $("#suggest").style.display = "none";
  const typing = document.createElement("div"); typing.className = "typing"; typing.textContent = "Copilot is working…";
  $("#msgs").appendChild(typing);
  try {
    const r = await api("/api/ask", {message: text});
    typing.remove();
    if (r.error) addMsg("err", esc(r.error));
    else addMsg("bot", md(r.reply || "(no answer)"));
    showApprovals(r.approvals);
    refresh();
  } catch (e) { typing.remove(); addMsg("err", esc(e.message)); }
  $("#send").disabled = false; $("#input").focus();
}

$("#composer").addEventListener("submit", e => { e.preventDefault(); send($("#input").value); });
$("#input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("#input").value); } });
$("#suggest").addEventListener("click", e => { if (e.target.tagName === "BUTTON") send(e.target.textContent); });
$("#newchat").addEventListener("click", async () => {
  await api("/api/chat/reset", {}).catch(() => {});
  $("#msgs").innerHTML = '<div class="msg bot"><p>New conversation. What do you need?</p></div>';
  $("#suggest").style.display = "";
});
$("#refresh").addEventListener("click", refresh);

refresh();
api("/api/approvals").then(showApprovals).catch(() => {});
setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 15000);
</script>
</body>
</html>
