[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2p-agents"
version = "0.1.0"
description = "Agentic P2P orchestration and run-support: config replication, FRD/TDD generation and ServiceNow triage for Coupa, SAP Ariba, PDAP, ReadSoft Online and Tungsten."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.86,<1",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
p2p = "p2p_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
